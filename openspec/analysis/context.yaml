  - id: CTX-EXT-002
    name: LINE Messaging API（推播通知）
    description: >
      預約模組要求「預約狀態變化須發送 LINE 通知」，但專案目前完全未整合 LINE Messaging
      API（無 channel access token）。這是本次變更的全新外部依賴。原本一併考慮的「會員須為
      LINE 官方帳號好友才能預約」前提已於 2026-08-20 使用者決策中移除（見 FR-010 deprecated），
      通知改為 best-effort：會員若非好友，通知會靜默送達失敗，不影響預約流程本身，因此本項不再
      需要好友狀態 webhook/追蹤機制，範圍縮小為單純的推播發送能力。
    status: new_dependency
