    resolution: >
      已於本次驗證中修訂 domain-model.yaml：EVT-001（BookingConfirmed）、EVT-002
      （BookingPendingReview）、EVT-003（BookingRejected）、EVT-004（BookingCancelled）
      的 useCases 皆補上 UC-008（EVT-005/BookingReviewOverdue 因其下游處理結果本身
      尚未確定，維持不連結 UC-008，避免過早暗示一定會發通知）。

