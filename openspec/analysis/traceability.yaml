      任何一處被引用。根因與上一項相同：其唯一關聯的 UC-008 沒有對應 API endpoint
      （設計上為內部 side effect），故本階段沒有自然的落地位置。
    severity: low
    suggestedAction: >
      不強制在分析階段落地；建議 /opsx:propose 的 design.md 明確描述通知失敗的
      重試/記錄/補償機制，避免這條 NFR 真的被遺忘。

