    description: >
      Firestore top-level collection，對應 AGG-002 TimeSlot（含 VO-002 TimeRange 內嵌為
      startAt/endAt 兩個欄位，因為 TimeRange 只在 TimeSlot 內使用，無獨立查詢需求，
      不需要獨立表）。以 serviceId 欄位參照 booking_services（無真正 FK，靠 query）。

      容量併發控制（RULE-001/NFR-001）：建立 Booking 時，須在同一個 Firestore
      transaction 內同時讀取本文件的 confirmedCount/pendingCount、驗證未超過
      capacity、寫入 bookings 新文件、並遞增本文件對應計數欄位——這代表
      booking_time_slots 與 bookings 這兩個 collection 的寫入必須落在同一次
      transaction 呼叫內（Firestore 跨 collection transaction 原生支援，不需要
      額外的 subcollection 結構）。

      查詢慣例：依 serviceId + startAt 排序列出某服務項目的時段（UC-002/UC-004），
      需要 (serviceId, startAt) 複合索引；確切索引定義留待實作階段依實際查詢調整。
    columns:
      - { name: id, type: string, constraints: "document id" }
      - { name: serviceId, type: string, constraints: "required, references booking_services.id" }
      - { name: startAt, type: timestamp, constraints: required }
      - { name: endAt, type: timestamp, constraints: "required, > startAt" }
      - { name: capacity, type: int, constraints: "required, >= 1" }
      - { name: confirmedCount, type: int, constraints: "required, default 0, invariant: confirmedCount + pendingCount <= capacity" }
      - { name: pendingCount, type: int, constraints: "required, default 0" }
      - { name: createdAt, type: timestamp, constraints: required }
      - { name: updatedAt, type: timestamp, constraints: required }
    primaryKey: id
    domainModel: [ENT-002, VO-002]
    api: [API-004, API-005, API-006, API-012, API-014]

