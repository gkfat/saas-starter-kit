# Cloud Run service manifest for apps/server.
#
# Deploy (after building & pushing the image built from apps/server/Dockerfile):
#   gcloud run services replace apps/server/service.yaml --region=<REGION> --project=<PROJECT_ID>
#
# First deploy must substitute `image:` below with the real image URL
# (e.g. us-central1-docker.pkg.dev/<PROJECT_ID>/<REPO>/saas-starter-kit-server:<TAG>).
# Env vars containing secrets (FIREBASE_PRIVATE_KEY, etc.) SHALL be set via
# `gcloud run services update --set-secrets` / Secret Manager, not committed here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: saas-starter-kit-server
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # min-instances: 0 — scale to zero when idle, no cost while unused
        autoscaling.knative.dev/minScale: '0'
        # max-instances cap — bound worst-case cost under unexpected traffic
        autoscaling.knative.dev/maxScale: '3'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: IMAGE_URL_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          env:
            - name: APP_ENV
              value: production
